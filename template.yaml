AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kahaan single-area civic discovery and contributions
Parameters:
  FrontendOrigin:
    Type: String
    Description: Exact HTTPS Amplify origin (no trailing slash)
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
Resources:
  Places:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: area
          AttributeType: S
        - AttributeName: placeId
          AttributeType: S
      KeySchema:
        - AttributeName: area
          KeyType: HASH
        - AttributeName: placeId
          KeyType: RANGE
  Votes:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: placeId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: placeId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin, 'http://localhost:5173', 'http://127.0.0.1:5173']
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, OPTIONS]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              audience: [!Ref UserPoolClient]
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/api.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          PLACES_TABLE: !Ref Places
          VOTES_TABLE: !Ref Votes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Places
        - DynamoDBCrudPolicy:
            TableName: !Ref Votes
      Events:
        ListPlaces:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places
            Method: GET
        CreatePlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ConfirmPlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places/{id}/confirm
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ReportPlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places/{id}/report
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 7
Outputs:
  ApiFunctionName:
    Value: !Ref ApiFunction
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  PlacesTable:
    Value: !Ref Places
  VotesTable:
    Value: !Ref Votes
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
